<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img">
  <title>Pure pursuit on a Formula Student track: blue and yellow cone boundaries, the planned line, the slightly-off driven trail, the car, and the lookahead point at distance Ld with the steering arc to it</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
