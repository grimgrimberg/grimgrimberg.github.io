<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img">
  <title>Repo summarizer pipeline: a file tree feeds deterministic top-k selection, then token-budgeted shards, then an LLM provider that emits strict JSON, with a dashed provider-fallback route around it</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- file tree -->
    <path stroke="rgba(246,241,232,.3)" stroke-width="1" d="M20 66V177.5M20 75.5h8M36 80V109.5M36 92.5h8M36 109.5h8M20 126.5h8M20 143.5h8M20 160.5h8M20 177.5h8"/>
    <path stroke="#ff766d" stroke-width="1.3" d="M30 143.5H126"/>
    <!-- selected files converge into selection -->
    <path stroke="rgba(155,214,107,.55)" stroke-width="1" d="M140 92.5C150 92.5 150 114 162 116M140 109.5C150 109.5 152 118 162 119M140 160.5C150 160.5 150 126 162 123M140 177.5C150 177.5 150 130 162 126"/>
    <!-- SELECT: ranked scores with top-k cutoff -->
    <rect x="162" y="70" width="72" height="104" rx="3" stroke="#9bd66b" stroke-width="1.5"/>
    <path stroke="#9bd66b" stroke-width="5" stroke-linecap="butt" d="M172 84h50M172 98h42M172 112h36M172 126h30"/>
    <path stroke="rgba(246,241,232,.25)" stroke-width="5" stroke-linecap="butt" d="M172 148h20M172 162h12"/>
    <path stroke="#f6f1e8" stroke-opacity=".6" stroke-width="1" stroke-dasharray="3 3" d="M168 137H228"/>
    <!-- SHARDS: adaptive bins under a token budget -->
    <path stroke="#9bd66b" stroke-width="1.5" d="M234 122H248"/>
    <g stroke="#9bd66b" stroke-width="1.5">
      <rect x="254" y="76" width="16" height="98" rx="2"/>
      <rect x="276" y="76" width="16" height="98" rx="2"/>
      <rect x="298" y="76" width="16" height="98" rx="2"/>
      <rect x="320" y="76" width="16" height="98" rx="2"/>
    </g>
    <path stroke="#d8aa4f" stroke-width="1" stroke-dasharray="3 3" d="M249 90H341"/>
    <!-- main path to the provider and out to JSON -->
    <path stroke="#9bd66b" stroke-width="1.5" d="M336 122H356M392 122H402"/>
    <rect x="356" y="110" width="36" height="24" rx="3" stroke="#9bd66b" stroke-width="1.5"/>
    <!-- provider fallback route -->
    <path stroke="#d8aa4f" stroke-width="1.4" stroke-dasharray="5 4" d="M346 122V196Q346 200 350 200H452Q456 200 456 196V182"/>
    <!-- JSON output -->
    <g stroke="#9bd66b" stroke-width="1.8">
      <path d="M418 72Q408 72 408 82V112Q408 122 402 122Q408 122 408 132V162Q408 172 418 172"/>
      <path d="M486 72Q496 72 496 82V112Q496 122 502 122Q496 122 496 132V162Q496 172 486 172"/>
    </g>
    <path stroke="#9bd66b" stroke-width="4" stroke-opacity=".75" d="M422 102h52M422 132h30M422 162h40"/>
    <!-- interfaces (right) -->
    <path stroke="rgba(246,241,232,.18)" stroke-width="1" d="M514 92V150"/>
  </g>
  <g fill="#9bd66b">
    <rect x="256" y="106" width="12" height="66" rx="1" fill-opacity=".35"/>
    <rect x="278" y="94" width="12" height="78" rx="1" fill-opacity=".35"/>
    <rect x="300" y="122" width="12" height="50" rx="1" fill-opacity=".35"/>
    <rect x="322" y="100" width="12" height="72" rx="1" fill-opacity=".35"/>
    <circle cx="346" cy="122" r="2.8"/>
    <circle cx="140" cy="92.5" r="2.2"/><circle cx="140" cy="109.5" r="2.2"/>
    <circle cx="140" cy="160.5" r="2.2"/><circle cx="140" cy="177.5" r="2.2"/>
    <path d="M249 122l-6-3.5v7zM408 122l-6-3.5v7z"/>
  </g>
  <path fill="#d8aa4f" d="M456 178l-3.5 6h7z"/>
  <g font-family="Cascadia Mono, JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="1" fill="rgba(246,241,232,.55)">
    <text x="12" y="62">repo/</text>
    <text x="30" y="79">src/</text>
    <text x="46" y="96" fill="#9bd66b">api.py</text>
    <text x="46" y="113" fill="#9bd66b">cli.py</text>
    <text x="30" y="130">tests/</text>
    <text x="30" y="147" fill="rgba(255,118,109,.7)">node_modules/</text>
    <text x="30" y="164" fill="#9bd66b">README.md</text>
    <text x="30" y="181" fill="#9bd66b">pyproject.toml</text>
    <g fill="#f6f1e8" text-anchor="middle">
      <text x="198" y="62">SELECT</text>
      <text x="295" y="62">SHARDS</text>
      <text x="374" y="126" font-size="9">LLM</text>
      <text x="452" y="62">JSON</text>
    </g>
    <text x="223" y="133" font-size="9" fill="rgba(246,241,232,.6)">k</text>
    <text x="401" y="216" text-anchor="middle" fill="#d8aa4f">PROVIDER FALLBACK</text>
    <g fill="#9bd66b" font-size="9"><text x="422" y="96">"summary"</text><text x="422" y="126">"stack"</text><text x="422" y="156">"layout"</text></g>
    <text x="524" y="104">POST /summarize</text>
    <text x="524" y="124">$ summarize .</text>
    <text x="524" y="144" fill="#9bd66b">SCHEMA OK</text>
  </g>
</svg>
